<svg xmlns="http://www.w3.org/2000/svg" width="880" height="192" viewBox="0 0 880 192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Costly decisions found by the blunder hunter, by round"><rect x="0.5" y="0.5" width="879" height="191" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="20.0" y="32.0" fill="#1f2328" font-size="16" font-weight="600" text-anchor="start">Costly decisions found by the blunder hunter, by round</text><text x="20.0" y="52.0" fill="#59636e" font-size="12" font-weight="400" text-anchor="start">A decision counts only when another move wins more often on the same later luck. Most mistakes happen in round 1.</text><text x="20.0" y="90.0" fill="#1f2328" font-size="13" font-weight="600" text-anchor="start">Round 1</text><path d="M110.0,76.0 H726.0 A4,4 0 0 1 730.0,80.0 V92.0 A4,4 0 0 1 726.0,96.0 H110.0 Z" fill="#2a78d6"/><text x="738.0" y="90.0" fill="#1f2328" font-size="12" font-weight="600" text-anchor="start">95 (62%)</text><text x="20.0" y="122.0" fill="#1f2328" font-size="13" font-weight="600" text-anchor="start">Round 2</text><path d="M110.0,108.0 H451.9 A4,4 0 0 1 455.9,112.0 V124.0 A4,4 0 0 1 451.9,128.0 H110.0 Z" fill="#2a78d6"/><text x="463.9" y="122.0" fill="#1f2328" font-size="12" font-weight="600" text-anchor="start">53 (35%)</text><text x="20.0" y="154.0" fill="#1f2328" font-size="13" font-weight="600" text-anchor="start">Round 3</text><path d="M110.0,140.0 H132.1 A4,4 0 0 1 136.1,144.0 V156.0 A4,4 0 0 1 132.1,160.0 H110.0 Z" fill="#2a78d6"/><text x="144.1" y="154.0" fill="#1f2328" font-size="12" font-weight="600" text-anchor="start">4 (3%)</text></svg>
