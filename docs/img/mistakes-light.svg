<svg xmlns="http://www.w3.org/2000/svg" width="880" height="192" viewBox="0 0 880 192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Costly decisions found by the blunder hunter, by round"><rect x="0.5" y="0.5" width="879" height="191" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="20.0" y="32.0" fill="#1f2328" font-size="16" font-weight="600" text-anchor="start">Costly decisions found by the blunder hunter, by round</text><text x="20.0" y="52.0" fill="#59636e" font-size="12" font-weight="400" text-anchor="start">A decision counts only when another move wins more often on the same later luck. Most mistakes happen in round 1.</text><text x="20.0" y="90.0" fill="#1f2328" font-size="13" font-weight="600" text-anchor="start">Round 1</text><path d="M110.0,76.0 H726.0 A4,4 0 0 1 730.0,80.0 V92.0 A4,4 0 0 1 726.0,96.0 H110.0 Z" fill="#2a78d6"/><text x="738.0" y="90.0" fill="#1f2328" font-size="12" font-weight="600" text-anchor="start">190 (63%)</text><text x="20.0" y="122.0" fill="#1f2328" font-size="13" font-weight="600" text-anchor="start">Round 2</text><path d="M110.0,108.0 H438.8 A4,4 0 0 1 442.8,112.0 V124.0 A4,4 0 0 1 438.8,128.0 H110.0 Z" fill="#2a78d6"/><text x="450.8" y="122.0" fill="#1f2328" font-size="12" font-weight="600" text-anchor="start">102 (34%)</text><text x="20.0" y="154.0" fill="#1f2328" font-size="13" font-weight="600" text-anchor="start">Round 3</text><path d="M110.0,140.0 H141.9 A4,4 0 0 1 145.9,144.0 V156.0 A4,4 0 0 1 141.9,160.0 H110.0 Z" fill="#2a78d6"/><text x="153.9" y="154.0" fill="#1f2328" font-size="12" font-weight="600" text-anchor="start">11 (4%)</text></svg>
