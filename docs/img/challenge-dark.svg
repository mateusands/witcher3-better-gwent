<svg xmlns="http://www.w3.org/2000/svg" width="880" height="356" viewBox="0 0 880 356" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Choosing your challenge"><rect x="0.5" y="0.5" width="879" height="355" rx="10" fill="#161b22" stroke="#30363d"/><text x="20.0" y="32.0" fill="#f0f6fc" font-size="16" font-weight="600" text-anchor="start">Choosing your challenge</text><text x="20.0" y="52.0" fill="#9198a1" font-size="12" font-weight="400" text-anchor="start">Two independent dials; the mod Off leaves the game exactly as shipped.</text><rect x="20.0" y="70" width="412.0" height="92" rx="8" fill="none" stroke="#30363d"/><text x="34.0" y="94.0" fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="start">Dial 1 · AI difficulty</text><text x="34.0" y="112.0" fill="#9198a1" font-size="12" font-weight="400" text-anchor="start">how well the NPC thinks</text><rect x="34.0" y="124" width="122.7" height="26" rx="13" fill="#256abf"/><text x="95.3" y="141.0" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Easy</text><rect x="164.7" y="124" width="122.7" height="26" rx="13" fill="#3987e5"/><text x="226.0" y="141.0" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">Normal</text><rect x="295.3" y="124" width="122.7" height="26" rx="13" fill="#86b6ef"/><text x="356.7" y="141.0" fill="#0d1117" font-size="12" font-weight="600" text-anchor="middle">Hard</text><rect x="448.0" y="70" width="412.0" height="92" rx="8" fill="none" stroke="#30363d"/><text x="462.0" y="94.0" fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="start">Dial 2 · NPC decks</text><text x="462.0" y="112.0" fill="#9198a1" font-size="12" font-weight="400" text-anchor="start">which cards the NPC plays: few extras, balanced to yours, best</text><rect x="462.0" y="124" width="122.7" height="26" rx="13" fill="#256abf"/><text x="523.3" y="141.0" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Original</text><rect x="592.7" y="124" width="122.7" height="26" rx="13" fill="#3987e5"/><text x="654.0" y="141.0" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">Adaptive</text><rect x="723.3" y="124" width="122.7" height="26" rx="13" fill="#86b6ef"/><text x="784.7" y="141.0" fill="#0d1117" font-size="12" font-weight="600" text-anchor="middle">Strong</text><text x="20.0" y="196.0" fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="start">Combinations, from light to heavy</text><rect x="20.0" y="210" width="201.0" height="128" rx="8" fill="none" stroke="#30363d"/><rect x="34.0" y="224" width="40.2" height="8" rx="4" fill="#184f95"/><rect x="78.2" y="224" width="40.2" height="8" rx="4" fill="#262c36"/><rect x="122.5" y="224" width="40.2" height="8" rx="4" fill="#262c36"/><rect x="166.8" y="224" width="40.2" height="8" rx="4" fill="#262c36"/><text x="34.0" y="258.0" fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="start">The original game</text><text x="34.0" y="280.0" fill="#3987e5" font-size="12" font-weight="600" text-anchor="start">Mod Off</text><text x="34.0" y="302.0" fill="#9198a1" font-size="12" font-weight="400" text-anchor="start">The game exactly as</text><text x="34.0" y="318.0" fill="#9198a1" font-size="12" font-weight="400" text-anchor="start">shipped.</text><rect x="233.0" y="210" width="201.0" height="128" rx="8" fill="none" stroke="#30363d"/><rect x="247.0" y="224" width="40.2" height="8" rx="4" fill="#184f95"/><rect x="291.2" y="224" width="40.2" height="8" rx="4" fill="#256abf"/><rect x="335.5" y="224" width="40.2" height="8" rx="4" fill="#262c36"/><rect x="379.8" y="224" width="40.2" height="8" rx="4" fill="#262c36"/><text x="247.0" y="258.0" fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="start">A smarter opponent</text><text x="247.0" y="280.0" fill="#3987e5" font-size="12" font-weight="600" text-anchor="start">Hard · Original decks</text><text x="247.0" y="302.0" fill="#9198a1" font-size="12" font-weight="400" text-anchor="start">Same NPC decks, better</text><text x="247.0" y="318.0" fill="#9198a1" font-size="12" font-weight="400" text-anchor="start">decisions.</text><rect x="446.0" y="210" width="201.0" height="128" rx="8" fill="none" stroke="#30363d"/><rect x="460.0" y="224" width="40.2" height="8" rx="4" fill="#184f95"/><rect x="504.2" y="224" width="40.2" height="8" rx="4" fill="#256abf"/><rect x="548.5" y="224" width="40.2" height="8" rx="4" fill="#3987e5"/><rect x="592.8" y="224" width="40.2" height="8" rx="4" fill="#262c36"/><text x="460.0" y="258.0" fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="start">A fair fight</text><text x="460.0" y="280.0" fill="#3987e5" font-size="12" font-weight="600" text-anchor="start">Normal or Hard · Adaptive</text><text x="460.0" y="302.0" fill="#9198a1" font-size="12" font-weight="400" text-anchor="start">The NPC's deck follows</text><text x="460.0" y="318.0" fill="#9198a1" font-size="12" font-weight="400" text-anchor="start">yours all game.</text><rect x="659.0" y="210" width="201.0" height="128" rx="8" fill="none" stroke="#30363d"/><rect x="673.0" y="224" width="40.2" height="8" rx="4" fill="#184f95"/><rect x="717.2" y="224" width="40.2" height="8" rx="4" fill="#256abf"/><rect x="761.5" y="224" width="40.2" height="8" rx="4" fill="#3987e5"/><rect x="805.8" y="224" width="40.2" height="8" rx="4" fill="#86b6ef"/><text x="673.0" y="258.0" fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="start">Maximum challenge</text><text x="673.0" y="280.0" fill="#3987e5" font-size="12" font-weight="600" text-anchor="start">Hard · Strong · stakes On</text><text x="673.0" y="302.0" fill="#9198a1" font-size="12" font-weight="400" text-anchor="start">The strongest NPC the rules</text><text x="673.0" y="318.0" fill="#9198a1" font-size="12" font-weight="400" text-anchor="start">allow.</text></svg>
