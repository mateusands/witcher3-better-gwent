<svg xmlns="http://www.w3.org/2000/svg" width="880" height="208" viewBox="0 0 880 208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Costly decisions found by the blunder hunter, by round"><rect x="0.5" y="0.5" width="879" height="207" rx="10" fill="#161b22" stroke="#30363d"/><text x="20.0" y="32.0" fill="#f0f6fc" font-size="16" font-weight="600" text-anchor="start">Costly decisions found by the blunder hunter, by round</text><text x="20.0" y="52.0" fill="#9198a1" font-size="12" font-weight="400" text-anchor="start">A decision counts only when another move wins more often on the same later luck. Most mistakes happen in round 1.</text><rect x="20" y="64" width="12" height="12" rx="3" fill="#3987e5"/><text x="40.0" y="75.0" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start">Costly decisions in that round (share of all found)</text><text x="20.0" y="106.0" fill="#f0f6fc" font-size="13" font-weight="600" text-anchor="start">Round 1</text><path d="M110.0,92.0 H726.0 A4,4 0 0 1 730.0,96.0 V108.0 A4,4 0 0 1 726.0,112.0 H110.0 Z" fill="#3987e5"/><text x="738.0" y="106.0" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="start">262 (64%)</text><text x="20.0" y="138.0" fill="#f0f6fc" font-size="13" font-weight="600" text-anchor="start">Round 2</text><path d="M110.0,124.0 H430.2 A4,4 0 0 1 434.2,128.0 V140.0 A4,4 0 0 1 430.2,144.0 H110.0 Z" fill="#3987e5"/><text x="442.2" y="138.0" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="start">137 (33%)</text><text x="20.0" y="170.0" fill="#f0f6fc" font-size="13" font-weight="600" text-anchor="start">Round 3</text><path d="M110.0,156.0 H132.0 A4,4 0 0 1 136.0,160.0 V172.0 A4,4 0 0 1 132.0,176.0 H110.0 Z" fill="#3987e5"/><text x="144.0" y="170.0" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="start">11 (3%)</text></svg>
