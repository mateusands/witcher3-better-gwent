<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Repository layout"><rect x="0.5" y="0.5" width="879" height="309" rx="10" fill="#161b22" stroke="#30363d"/><text x="20.0" y="32.0" fill="#f0f6fc" font-size="16" font-weight="600" text-anchor="start">Repository layout</text><text x="20" y="76" fill="#3987e5" font-size="13" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">mod/settings/</text><text x="270.0" y="76.0" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="start">Options menu and WitcherScript wrappers for settings, wagers and deck difficulty</text><line x1="20" y1="90" x2="860" y2="90" stroke="#262c36"/><text x="20" y="106" fill="#3987e5" font-size="13" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">mod/v8/as3/</text><text x="270.0" y="106.0" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="start">The V8 AI in ActionScript, compiled into the Gwent interface at build time</text><line x1="20" y1="120" x2="860" y2="120" stroke="#262c36"/><text x="20" y="136" fill="#3987e5" font-size="13" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">mod/recorder/</text><text x="270.0" y="136.0" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="start">Script sources of diagnostic builds (match recorder; also probe/, feasibility/)</text><line x1="20" y1="150" x2="860" y2="150" stroke="#262c36"/><text x="20" y="166" fill="#3987e5" font-size="13" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">tools/</text><text x="270.0" y="166.0" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="start">Build pipeline, patchers that insert the mod hooks, format helpers, recorder readers</text><line x1="20" y1="180" x2="860" y2="180" stroke="#262c36"/><text x="20" y="196" fill="#3987e5" font-size="13" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">sim/</text><text x="270.0" y="196.0" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="start">Python reference of the V8 policy, evaluation scripts and tests</text><line x1="20" y1="210" x2="860" y2="210" stroke="#262c36"/><text x="20" y="226" fill="#3987e5" font-size="13" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">sim/gwentsim/</text><text x="270.0" y="226.0" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="start">Policy, search, belief, position and player-deck models</text><line x1="20" y1="240" x2="860" y2="240" stroke="#262c36"/><text x="20" y="256" fill="#3987e5" font-size="13" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">lab/</text><text x="270.0" y="256.0" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="start">Gwent AI Lab: crash-safe job runner, web panel, reports and these charts</text><line x1="20" y1="270" x2="860" y2="270" stroke="#262c36"/><text x="20" y="286" fill="#3987e5" font-size="13" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">docs/</text><text x="270.0" y="286.0" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="start">Testing, research, development and repository scope</text></svg>
